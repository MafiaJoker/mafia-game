server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Рассадка - страница для поисковиков и превью ссылок: свой HTML с
    # заголовком, описанием и текстом (seating.html собирает vite.config.mjs).
    # Файл отдаем здесь же, а не переходом на другой location: иначе
    # потерялись бы заголовки ответа ниже
    location = /seating {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /seating.html /index.html;
    }

    # Сохраненные рассадки /seating/<id> - тот же HTML, но в поиск им не надо:
    # там только страница генератора
    location ^~ /seating/ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex";
        try_files /seating.html /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}
