name: Deploy

on:
  push:
    branches: [master]
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'production' || 'development' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.primary.outputs.version }}
      short_sha: ${{ steps.primary.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.VULTR_REGISTRY_URL }}
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.VULTR_REGISTRY_URL }}/mafia-helper-web
          tags: |
            type=sha,format=short,prefix=dev-,enable=${{ github.event_name == 'push' }}
            type=raw,value=dev-latest,enable=${{ github.event_name == 'push' }}
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - id: primary
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            version="${{ github.ref_name }}"
          else
            version="dev-${short_sha}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ github.event_name == 'release' && 'https://api.jokermafia.am/api/v1' || 'https://dev.api.jokermafia.am/api/v1' }}
            VITE_TELEGRAM_BOT_USERNAME=${{ github.event_name == 'release' && 'mafia_joker_widget_bot' || 'dev_mafia_joker_widget_bot' }}
            VITE_SHOW_TEST_LOGIN=false
            VITE_APP_COMMIT_HASH=${{ steps.primary.outputs.short_sha }}
            VITE_APP_VERSION=${{ github.event_name == 'release' && github.ref_name || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'development' }}
    env:
      IMAGE: ${{ secrets.VULTR_REGISTRY_URL }}/mafia-helper-web:${{ needs.build.outputs.version }}
      NAMESPACE: ${{ github.event_name == 'release' && 'mafia-helper-prod' || 'mafia-helper-dev' }}
      OVERLAY: ${{ github.event_name == 'release' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 0600 "$HOME/.kube/config"

      - name: Apply overlay
        run: |
          cd "deployments/overlays/${OVERLAY}"
          kustomize edit set image "mafia-helper-web=${IMAGE}"
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/web --timeout=5m
